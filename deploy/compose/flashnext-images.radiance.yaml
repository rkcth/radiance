# Two R9700s with 32 GiB each and about 184 GiB host RAM visible to Linux.
# Download the RAD2 checkpoints and adjust the paths before starting Radiance.
server:
  host: 127.0.0.1
  port: 8000
  api-key-env: RADIANCE_API_KEY
memory:
  host-headroom-mib: 8192
  gpu-headroom-mib: 384
scheduler:
  warm-up: false
  load-timeout: 180s
models:
  qwen-flash-next:
    model: /models/swift15-flashnext-autoround.rad
    aliases: [default]
    pin: true
    priority: 100
    tp: 2
    tp-wire: wht6
    placement: expert_tiered
    host-pool-mib: 65536
    gpu-memory-mib: 13600
    ngram-placement: disk
    vision-tower-placement: ram
    kv-cache-dtype: i8
    prefix-cache-mib: 16384
    max-model-len: 200000
    max-num-seqs: 8
    max-num-batched-tokens: 2048
    num-speculative-tokens: 4
    draft-window: adaptive
  krea-2-raw-edit-iq8r:
    model: /models/krea-2-raw-edit-iq8r.rad
    tp: 2
    max-num-seqs: 2
    image-gen-max-pixels: 1048576
    image-gen-max-refs: 2
    max-loras: 1
    max-lora-rank: 128
    lora-dir: /models/loras
  qwen-image-2.1-uc-iq8r:
    model: /models/qwen-image-2.1-uc-iq8r.rad
    tp: 2
    max-num-seqs: 2
    image-gen-max-pixels: 1048576
    image-gen-max-refs: 2
    max-loras: 1
    max-lora-rank: 128
    lora-dir: /models/loras
groups:
  secondaries:
    exclusive: [krea-2-raw-edit-iq8r, qwen-image-2.1-uc-iq8r]
