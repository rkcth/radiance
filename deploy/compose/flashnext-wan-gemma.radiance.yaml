# Two R9700s with 32 GiB each and about 184 GiB host RAM visible to Linux.
# Download the RAD2 checkpoints and adjust the paths before starting Radiance.
server:
  host: 127.0.0.1
  port: 8000
memory:
  host-headroom-mib: 8192
  gpu-headroom-mib: 384
scheduler:
  warm-up: false
  load-timeout: 180s
models:
  qwen-flash-next:
    model: /models/swift15-flashnext-autoround.rad
    aliases: [default]
    pin: true
    priority: 100
    tp: 2
    tp-wire: wht6
    placement: expert_tiered
    host-pool-mib: 65536
    gpu-memory-mib: 13600
    ngram-placement: disk
    vision-tower-placement: ram
    kv-cache-dtype: i8
    prefix-cache-mib: 16384
    max-model-len: 200000
    max-num-seqs: 8
    max-num-batched-tokens: 2048
    num-speculative-tokens: 4
    draft-window: adaptive
  wan-2.2-ti2v-5b-bf16:
    model: /models/wan-2.2-ti2v-5b-bf16.rad
    tp: 1
    max-num-seqs: 1
    vision-tower-placement: ram
    park: {ram: never}
  gemma4-26b-abliterated:
    model: /models/huihui-gemma4-26b-a4b-it-i8.rad
    tp: 2
    placement: expert_tiered
    host-pool-mib: 16384
    max-model-len: 8192
    max-num-seqs: 2
    max-num-batched-tokens: 512
    num-speculative-tokens: 0
    park: {ram: allowed}
  gemma4-31b-abliterated:
    model: /models/huihui-gemma4-31b-it-w4a8.rad
    tp: 2
    max-model-len: 8192
    max-num-seqs: 2
    max-num-batched-tokens: 512
    num-speculative-tokens: 0
    park: {ram: allowed}
groups:
  secondaries:
    exclusive: [wan-2.2-ti2v-5b-bf16, gemma4-26b-abliterated, gemma4-31b-abliterated]
