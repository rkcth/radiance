# A text primary and its reserved image generators share one listener.
# Edit these budgets to fit your cards and host RAM before raising limits.
server:
  host: 127.0.0.1
  port: 8000
  api-key-env: RADIANCE_API_KEY
memory:
  gpu-headroom-mib: 384
  host-headroom-mib: 8192
models:
  swift-flashnext:
    model: /models/swift15-flashnext-autoround.rad
    image-model: /models/qwen-image-2.1-uc-iq8r.rad
    image-model-reserve:
      - /models/krea-2-raw-edit-iq8r.rad
    tp: 2
    tp-wire: exact
    placement: expert_tiered
    # Total pinned expert pool across both ranks. Tune after checking available RAM.
    host-pool-mib: 40960
    ngram-placement: disk
    vision-tower-placement: ram
    kv-cache-dtype: i8
    max-num-seqs: 2
    max-model-len: 2048
    max-num-batched-tokens: 256
    num-speculative-tokens: 4
    draft-window: adaptive
    image-gen-max-pixels: 1048576
    image-gen-max-refs: 1
    image-snapshot-memory: pageable
    image-model-cache-mib: 0
    unloaded-image-expert-pool-mib: 12288
    lora-dir: /models/loras
    max-loras: 1
    max-lora-rank: 64
