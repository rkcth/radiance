# Include once in Nginx's http context (for example, in /etc/nginx/conf.d).
# Start both Radiance listeners with the same nonempty API key before exposing this port.
upstream radiance_primary {
    server 127.0.0.1:18000;
}

upstream radiance_cpu_asr {
    server 127.0.0.1:18001;
}

map $http_upgrade $radiance_connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_host $radiance_host {
    default $http_host;
    ''      $host;
}

server {
    listen 127.0.0.1:8000;
    # Match Radiance's request limit, including multipart and base64 overhead.
    client_max_body_size 512m;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_next_upstream off;
    # These are idle intervals between reads/writes, including while an image is rendering.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    send_timeout 600s;

    # Forward the original authority (including port) for Radiance's Origin check.
    proxy_set_header Host $radiance_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $radiance_connection_upgrade;

    location = /v1/audio/transcriptions {
        proxy_pass http://radiance_cpu_asr;
    }

    location = /audio/transcriptions {
        proxy_pass http://radiance_cpu_asr;
    }

    location = /v1/realtime {
        proxy_pass http://radiance_cpu_asr;
    }

    location / {
        proxy_pass http://radiance_primary;
    }
}
